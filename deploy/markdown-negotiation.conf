# Markdown Negotiation — anthonyprime.fr (VM 103)
# À placer dans /etc/nginx/conf.d/markdown-negotiation.conf
# Sert le .md quand un agent demande du markdown (Accept: text/markdown)
map $http_accept $md_suffix {
    default        "";
    "*/*"          "";
    "~*text/markdown"   ".md";
    "~*text/x-markdown"  ".md";
}
